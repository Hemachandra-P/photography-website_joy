{% extends "base.html" %}
{% block title %}Admin Settings — Joy Photography{% endblock %}
{% block content %}<main class="admin-page login-page"><div class="login-card"><div class="section-label">Security</div><h1>Change<br><em>Password.</em></h1><form method="post" action="{{ url_for('admin_settings') }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label><button class="solid-btn">Update password →</button></form><a href="{{ url_for('admin') }}" class="muted-link">← Back to dashboard</a></div></main>{% endblock %}
